name: Python compatibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.14'
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install prebuilt dependencies
        run: 'python -m pip install --only-binary=:all: -r requirements.txt'
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
